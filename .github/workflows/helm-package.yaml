name: Package and Deploy Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'charts/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  package-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: |
          helm lint charts/sick

      - name: Package Helm chart
        run: |
          helm package charts/sick -d ./packaged-charts

      - name: Upload Helm chart as artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-sick
          path: ./packaged-charts/*.tgz
          retention-days: 90
          if-no-files-found: error

      - name: List packaged charts
        run: |
          echo "Packaged charts:"
          ls -lh ./packaged-charts/
